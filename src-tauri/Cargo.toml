[package]
name = "swerve-build"
version = "0.2.1"
description = "Swerve Build — a clean Windows desktop shell for Grok Build and ACP agents"
authors = ["Swerve Build Contributors"]
license = "MIT"
repository = "https://github.com/Swervebytes/SwerveBuild"
edition = "2021"
default-run = "swerve-build"

[lib]
name = "swerve_build_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "swervebuild-mcp"
path = "src/bin/swervebuild_mcp.rs"

[[bin]]
name = "swervebuild-workflow"
path = "src/bin/swervebuild_workflow.rs"

[workspace]
members = ["crates/swerve-workflows"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
url = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
toml_edit = "0.22"
swerve-workflows = { path = "crates/swerve-workflows" }
# CDP client for app_ui drive (WebSocket to WebView2 remote-debugging-port).
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
