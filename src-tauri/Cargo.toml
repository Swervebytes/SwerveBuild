[package]
name = "swerve-build"
version = "0.3.23"
description = "Swerve Build — a clean Windows desktop shell for Grok Build and ACP agents"
authors = ["Swerve Build Contributors"]
license = "MIT"
repository = "https://github.com/Swervebytes/SwerveBuild"
edition = "2021"
default-run = "swerve-build"

[lib]
name = "swerve_build_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "swervebuild-mcp"
path = "src/bin/swervebuild_mcp.rs"

[[bin]]
name = "swervebuild-workflow"
path = "src/bin/swervebuild_workflow.rs"

# S24 — supervised media process (health shell; capture/encode later).
[[bin]]
name = "swervebuild-media"
path = "src/bin/swervebuild_media.rs"

[workspace]
members = ["crates/swerve-workflows"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` unlocks multi-webview-per-window (Window::add_child) — S13d docks
# the debug browser as a child webview INSIDE the main window instead of a
# separate hidden window. Pinned to a specific 2.x in Cargo.lock; revisit on
# Tauri minor bumps since the multiwebview API is not yet semver-stable.
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
url = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
toml_edit = "0.22"
swerve-workflows = { path = "crates/swerve-workflows" }
# CDP client for app_ui drive (WebSocket to WebView2 remote-debugging-port).
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
ureq = { version = "2.12", features = ["json"] }
# S23 — SQLite skeleton (artifacts now; chats migrate later). Bundled libsqlite.
rusqlite = { version = "0.32", features = ["bundled"] }
# S25 — display still capture inside media worker process.
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
cpal = "0.15"
# S36 — OS keystore for stream secrets (Windows Credential Manager).
# Windows-only build per VISION support matrix: default features pull the
# macOS/Linux backends (security-framework, secret-service, zbus) we never use.
# `v1` = the classic Entry API (required when default features are off).
keyring = { version = "4.1.6", default-features = false, features = [
    "v1",
    "windows-native-keyring-store",
] }
