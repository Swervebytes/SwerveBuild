[package]
name = "swerve-workflows"
version = "0.1.0"
description = "Swerve Workflows — headless node-graph workflow engine (no Tauri dependencies)"
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rquickjs = "0.12"
ureq = { version = "2", features = ["json"] }
url = "2"
regex = "1"

