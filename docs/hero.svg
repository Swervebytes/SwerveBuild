<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Swerve Build — a clean Windows home for Grok Build and ACP coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset="0.55" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="0.42" stop-color="#4fb8e0"/>
      <stop offset="0.6" stop-color="#6c7bff"/>
      <stop offset="0.78" stop-color="#e0625a"/>
      <stop offset="1" stop-color="#b45cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#1fb6d8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1fb6d8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#20304a" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="18" fill="none" stroke="#233046" stroke-opacity="0.6"/>

  <text x="72" y="96" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="20" letter-spacing="7" fill="#5f7192" font-weight="600">NATIVE WINDOWS AGENT SHELL</text>

  <text x="68" y="196" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="108" font-weight="800" letter-spacing="-2" fill="url(#wm)">SwerveBuild</text>

  <text x="72" y="252" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="27" fill="#c4cfe4" font-weight="400">A clean desktop home for <tspan font-weight="700" fill="#eef2fb">Grok Build</tspan> &amp; ACP coding agents.</text>
  <text x="72" y="288" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="27" fill="#c4cfe4" font-weight="400">Chats, tool approval, <tspan font-weight="700" fill="#eef2fb">triggered automations</tspan>, workflows, and a screen recorder.</text>

  <g font-family="Consolas, ui-monospace, monospace" font-size="15" font-weight="600">
    <g transform="translate(72,320)">
      <rect x="0" y="0" width="150" height="30" rx="15" fill="#0e1524" stroke="#2a3a55"/>
      <circle cx="20" cy="15" r="4" fill="#3fd0c9"/>
      <text x="34" y="20" fill="#aab8d4">Tauri · Rust</text>
    </g>
    <g transform="translate(234,320)">
      <rect x="0" y="0" width="104" height="30" rx="15" fill="#0e1524" stroke="#2a3a55"/>
      <text x="20" y="20" fill="#aab8d4">Windows</text>
    </g>
    <g transform="translate(350,320)">
      <rect x="0" y="0" width="66" height="30" rx="15" fill="#0e1524" stroke="#2a3a55"/>
      <text x="20" y="20" fill="#aab8d4">MIT</text>
    </g>
    <g transform="translate(428,320)">
      <rect x="0" y="0" width="118" height="30" rx="15" fill="#0e1524" stroke="#2a3a55"/>
      <text x="20" y="20" fill="#7fb2ff">Svelte 5</text>
    </g>
  </g>
</svg>
